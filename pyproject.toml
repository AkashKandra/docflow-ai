[project]
name = "docflow-ai"
version = "0.1.0"
description = "Invoice & KYC document processing automation on Azure (Logic Apps, Functions, Document Intelligence, Azure OpenAI, LangGraph, AI Search)"
requires-python = ">=3.10"

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [".local_data", "samples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]
"tests/*" = ["E402"]
